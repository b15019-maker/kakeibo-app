<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#090b10'><title>家計簿 Ver.6</title><style>
:root{--bg:#090b10;--card:#141821;--card2:#1b2130;--line:#2c3445;--text:#f5f7fb;--muted:#9ba6b8;--blue:#5da8ff;--green:#4fd18b;--red:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:14px 14px 96px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.label{font-size:12px;color:var(--muted)}.value{font-weight:800;margin-top:4px}.income{color:var(--green)}.expense{color:var(--red)}h2{font-size:19px;margin:18px 0 12px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}.iconbtn,button,input,select{font:inherit}.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week div{text-align:center;font-size:12px;color:var(--muted);padding:5px}.sun{color:var(--red)!important}.sat{color:var(--blue)!important}.day{min-height:72px;border:1.5px solid #3b4559;border-radius:10px;background:#111722;padding:6px;font-size:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.015)}.cal>div:empty{min-height:72px;border:1px solid #202838;border-radius:10px;background:#0c1017}.day .n{font-weight:700}.amt{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.form{display:grid;gap:12px}.field label{display:block;font-size:13px;margin-bottom:5px;color:#dbe2ee}input,select{width:100%;height:48px;background:#10141d;color:var(--text);border:1px solid #3b4559;border-radius:12px;padding:0 12px;font-size:16px}.primary{width:100%;height:50px;border:0;border-radius:12px;background:#2879e8;color:white;font-weight:800}.msg{min-height:20px;font-size:13px;color:var(--green)}.list{display:grid;gap:9px}.row{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px}.rowtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.small{font-size:12px;color:var(--muted);margin-top:5px}.danger{border:1px solid #60404a;background:#21161a;color:#ff9aa4;border-radius:10px;padding:9px 12px}.category-add{display:grid;grid-template-columns:1fr auto;gap:8px}.category-add button{border:0;background:#2879e8;color:#fff;border-radius:12px;padding:0 18px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(9,11,16,.97);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;z-index:5}.nav button{min-height:58px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--muted);font-size:10px;padding:5px 2px}.nav button.active{background:#14263e;border-color:#315b89;color:white}.nav b{display:block;font-size:18px;margin-bottom:2px}.page{display:none}.page.active{display:block}.sep{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}.empty{text-align:center;color:var(--muted);padding:24px 10px;border:1px dashed var(--line);border-radius:12px}.hint{font-size:13px;color:var(--muted);line-height:1.55}.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:99px;background:var(--card2);color:var(--muted);margin-right:4px}
</style></head><body><main class='app'>
<div class='summary'><div class='card'><div class='label'>収入</div><div id='sumIn' class='value income'>¥0</div></div><div class='card'><div class='label'>支出</div><div id='sumOut' class='value expense'>¥0</div></div><div class='card'><div class='label'>収支</div><div id='sumBal' class='value'>¥0</div></div></div>
<section id='calendar' class='page active'><div class='toolbar'><button id='prev' class='iconbtn'>‹</button><strong id='monthTitle'></strong><button id='next' class='iconbtn'>›</button></div><div class='week'><div class='sun'>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class='sat'>土</div></div><div id='cal' class='cal'></div></section>
<section id='entry' class='page'><h2>収支入力</h2><form id='entryForm' class='form'><div class='field'><label>種類</label><select id='entryType'><option value='expense'>支出</option><option value='income'>収入</option></select></div><div class='field'><label>日付</label><input id='entryDate' type='date' required></div><div class='field'><label>金額</label><input id='entryAmount' type='number' inputmode='numeric' min='1' required></div><div class='field'><label>カテゴリー</label><select id='entryCategory'></select></div><div class='field'><label>メモ</label><input id='entryMemo' type='text' maxlength='80'></div><button class='primary'>登録する</button><div id='entryMsg' class='msg'></div></form></section>
<section id='fixed' class='page'><h2>固定費を追加</h2><form id='fixedForm' class='form'><div class='field'><label>種類</label><select id='fixedType'><option value='expense'>固定費</option><option value='income'>給料・定期収入</option></select></div><div class='field'><label>名前</label><input id='fixedName' type='text' placeholder='家賃・給料など' required></div><div class='field'><label>金額</label><input id='fixedAmount' type='number' inputmode='numeric' min='1' required></div><div class='field'><label>周期</label><select id='fixedFreq'><option value='daily'>毎日</option><option value='monthly' selected>毎月</option><option value='bimonthly'>2ヶ月毎</option><option value='yearly'>毎年</option></select></div><div class='field'><label>基準日</label><input id='fixedDate' type='date' required></div><div class='field'><label>土日の処理</label><select id='fixedWeekend'><option value='same'>そのまま</option><option value='previous'>直前の平日</option><option value='next'>直後の平日</option></select></div><div class='field'><label>カテゴリー</label><select id='fixedCategory'></select></div><button class='primary'>固定費を登録</button><div id='fixedMsg' class='msg'></div></form></section>
<section id='fixedlist' class='page'><h2>固定費リスト</h2><div id='fixedStats' class='hint'></div><div id='fixedList' class='list' style='margin-top:12px'></div></section>
<section id='settings' class='page'><h2>設定</h2><div class='field'><label>家計簿の開始日</label><select id='startDay'></select></div><p class='hint'>例：25日を選ぶと、25日〜翌月24日を1か月として集計します。</p><div class='sep'><h2 style='margin-top:0'>カテゴリー設定</h2><p class='hint'>下の欄に好きな名前を入力して「追加」を押してください。</p><form id='categoryForm' class='category-add'><input id='categoryName' type='text' maxlength='30' placeholder='例：外食、ガソリン、子ども用品' autocomplete='off'><button type='submit'>追加</button></form><div id='categoryMsg' class='msg'></div><div id='categoryList' class='list'></div></div></section>
</main><nav class='nav'><button data-page='calendar' class='active'><b>▦</b>カレンダー</button><button data-page='entry'><b>＋</b>収支入力</button><button data-page='fixed'><b>¥</b>固定費</button><button data-page='fixedlist'><b>☷</b>固定費リスト</button><button data-page='settings'><b>⚙</b>設定</button></nav>
<script>
const KEY='kakeibo_v6_data';const defaults={entries:[],fixed:[],categories:['食費','日用品','家賃','光熱費','通信費','交通費','保険','給料','その他'],startDay:1};let state=(()=>{try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaults)}})();let view=new Date();const $=s=>document.querySelector(s);const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function refreshCategories(){const opts=state.categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('#entryCategory').innerHTML=opts;$('#fixedCategory').innerHTML=opts;$('#categoryList').innerHTML=state.categories.map((c,i)=>`<div class='row rowtop'><strong>${esc(c)}</strong><button class='danger' data-delcat='${i}' type='button'>削除</button></div>`).join('')}
function adjusted(date,rule){let d=new Date(date);if(rule==='previous'){if(d.getDay()===6)d.setDate(d.getDate()-1);else if(d.getDay()===0)d.setDate(d.getDate()-2)}if(rule==='next'){if(d.getDay()===6)d.setDate(d.getDate()+2);else if(d.getDay()===0)d.setDate(d.getDate()+1)}return d}
function occurrencesFor(y,m){const out=[];state.fixed.forEach(f=>{const b=parse(f.date);const add=d=>{const a=adjusted(d,f.weekend);if(a.getFullYear()===y&&a.getMonth()===m)out.push({...f,date:iso(a),generated:true})};if(f.freq==='daily'){for(let d=1;d<=new Date(y,m+1,0).getDate();d++)add(new Date(y,m,d))}else if(f.freq==='monthly'){add(new Date(y,m,Math.min(b.getDate(),new Date(y,m+1,0).getDate())))}else if(f.freq==='bimonthly'){const diff=(y-b.getFullYear())*12+m-b.getMonth();if(diff>=0&&diff%2===0)add(new Date(y,m,Math.min(b.getDate(),new Date(y,m+1,0).getDate())))}else if(f.freq==='yearly'&&m===b.getMonth()&&y>=b.getFullYear()){add(new Date(y,m,Math.min(b.getDate(),new Date(y,m+1,0).getDate())))}});return out}
function accountingRange(y,m){const s=state.startDay;if(s===1)return [new Date(y,m,1),new Date(y,m+1,1)];return [new Date(y,m-1,s),new Date(y,m,s)]}
function allItemsForRange(start,end){const items=[...state.entries];for(let d=new Date(start);d<end;d.setMonth(d.getMonth()+1)){items.push(...occurrencesFor(d.getFullYear(),d.getMonth()))}return items.filter(x=>{const d=parse(x.date);return d>=start&&d<end})}
function render(){const y=view.getFullYear(),m=view.getMonth();$('#monthTitle').textContent=`${y}年 ${m+1}月`;const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),fixed=occurrencesFor(y,m);let html='';for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=days;d++){const ds=iso(new Date(y,m,d)),items=[...state.entries.filter(x=>x.date===ds),...fixed.filter(x=>x.date===ds)],inc=items.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),exp=items.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0),dow=new Date(y,m,d).getDay();html+=`<div class='day'><div class='n ${dow===0?'sun':dow===6?'sat':''}'>${d}</div>${inc?`<div class='amt income'>+${yen(inc)}</div>`:''}${exp?`<div class='amt expense'>-${yen(exp)}</div>`:''}</div>`}$('#cal').innerHTML=html;const [start,end]=accountingRange(y,m),items=allItemsForRange(start,end),inc=items.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),exp=items.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0);$('#sumIn').textContent=yen(inc);$('#sumOut').textContent=yen(exp);$('#sumBal').textContent=yen(inc-exp);$('#sumBal').className='value '+(inc-exp>=0?'income':'expense');renderFixedList()}
function renderFixedList(){const freq={daily:'毎日',monthly:'毎月',bimonthly:'2ヶ月毎',yearly:'毎年'},weekend={same:'そのまま',previous:'直前の平日',next:'直後の平日'};$('#fixedStats').textContent=`${state.fixed.length}件登録`;$('#fixedList').innerHTML=state.fixed.length?state.fixed.map((f,i)=>`<div class='row'><div class='rowtop'><div><strong>${esc(f.name)}</strong><div class='value ${f.type==='income'?'income':'expense'}'>${yen(f.amount)}</div></div><button type='button' class='danger' data-delfixed='${i}'>削除</button></div><div class='small'><span class='pill'>${freq[f.freq]}</span><span class='pill'>${esc(f.category)}</span><br>基準日 ${esc(f.date)} ・ 土日 ${weekend[f.weekend]}</div></div>`).join(''):`<div class='empty'>固定費はまだ登録されていません。</div>`}
$('.nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.page).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$('#categoryForm').addEventListener('submit',e=>{e.preventDefault();const input=$('#categoryName'),name=input.value.trim(),msg=$('#categoryMsg');if(!name){msg.textContent='カテゴリー名を入力してください';input.focus();return}if(state.categories.some(c=>c.toLowerCase()===name.toLowerCase())){msg.textContent='同じカテゴリーがすでにあります';return}state.categories.push(name);save();refreshCategories();input.value='';msg.textContent=`「${name}」を追加しました`;input.focus()});
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();state.entries.push({id:crypto.randomUUID(),type:$('#entryType').value,date:$('#entryDate').value,amount:Number($('#entryAmount').value),category:$('#entryCategory').value,memo:$('#entryMemo').value});save();$('#entryAmount').value='';$('#entryMemo').value='';$('#entryMsg').textContent='登録しました';render()});
$('#fixedForm').addEventListener('submit',e=>{e.preventDefault();state.fixed.push({id:crypto.randomUUID(),type:$('#fixedType').value,name:$('#fixedName').value.trim(),amount:Number($('#fixedAmount').value),freq:$('#fixedFreq').value,date:$('#fixedDate').value,weekend:$('#fixedWeekend').value,category:$('#fixedCategory').value});save();$('#fixedName').value='';$('#fixedAmount').value='';$('#fixedMsg').textContent='固定費リストに登録しました';render()});
document.addEventListener('click',e=>{const c=e.target.closest('[data-delcat]');if(c){state.categories.splice(Number(c.dataset.delcat),1);if(!state.categories.length)state.categories=['その他'];save();refreshCategories()}const f=e.target.closest('[data-delfixed]');if(f){state.fixed.splice(Number(f.dataset.delfixed),1);save();render()}});
$('#startDay').innerHTML=Array.from({length:28},(_,i)=>`<option value='${i+1}'>毎月 ${i+1}日</option>`).join('');$('#startDay').value=state.startDay;$('#startDay').onchange=e=>{state.startDay=Number(e.target.value);save();render()};const today=iso(new Date());$('#entryDate').value=today;$('#fixedDate').value=today;refreshCategories();render();
</script></body></html>
